<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ALZ CUP ONLINE</title>
  <style>
    :root { --accent:#a855f7; --accent2:#38bdf8; --panel:rgba(12,12,22,.92); }
    * { box-sizing:border-box; }
    html, body { margin:0; min-height:100%; font-family:Arial,Helvetica,sans-serif; }
    body { background:transparent; color:#fff; }
    #overlay { position:fixed; top:22px; left:22px; width:390px; padding:14px 17px 16px;
      border:1px solid rgba(168,85,247,.85); border-radius:13px;
      background:linear-gradient(115deg,rgba(9,10,24,.96),rgba(27,16,48,.94));
      box-shadow:0 8px 28px rgba(0,0,0,.35); }
    .topline { display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:12px; }
    .brand { font-size:17px; font-weight:900; letter-spacing:1.5px; }
    .live { color:#fff; background:#dc2626; border-radius:20px; padding:4px 9px; font-size:10px; font-weight:800; letter-spacing:1px; }
    #matchTitle { color:#c4b5fd; font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:1px; margin-bottom:10px; }
    .scoreline { display:grid; grid-template-columns:1fr 95px 1fr; align-items:center; gap:8px; }
    .team { min-width:0; font-size:15px; font-weight:800; text-transform:uppercase; overflow-wrap:anywhere; }
    .team.right { text-align:right; }
    .score { display:flex; justify-content:center; align-items:center; gap:9px; font-size:34px; font-weight:900; font-variant-numeric:tabular-nums; }
    .dash { color:#a78bfa; font-size:24px; }
    #matchStatus { margin-top:10px; text-align:center; color:#cbd5e1; font-size:10px; letter-spacing:1.2px; text-transform:uppercase; }
    #admin { display:none; max-width:560px; margin:30px auto; padding:22px; color:#111827; background:#fff; border-radius:14px; box-shadow:0 12px 40px #0002; }
    #admin h1 { margin:0 0 5px; font-size:22px; }
    #admin p { margin:0 0 18px; color:#64748b; font-size:13px; }
    label { display:block; margin:12px 0 5px; font-size:13px; font-weight:700; }
    input { width:100%; padding:11px 12px; border:1px solid #cbd5e1; border-radius:8px; font-size:15px; }
    .grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
    .scores { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
    button { margin-top:14px; border:0; border-radius:8px; padding:11px 15px; background:#7c3aed; color:white; font-weight:800; cursor:pointer; }
    button.secondary { background:#475569; }
    button:disabled { opacity:.55; cursor:wait; }
    #message { min-height:20px; margin-top:12px; font-size:13px; color:#0f766e; }
    #loginPanel, #editorPanel { display:none; }
    .adminHead { display:flex; justify-content:space-between; align-items:center; gap:12px; }
    .adminHead button { margin:0; }
    body.admin-mode { background:#f1f5f9; }
    @media (max-width:600px) { #admin { margin:12px; } }
  </style>
</head>
<body>
  <section id="overlay" aria-label="Score ALZ CUP">
    <div class="topline"><div class="brand">ALZ CUP <span style="color:#c084fc">ONLINE</span></div><div class="live">LIVE SCORE</div></div>
    <div id="matchTitle">MATCH EN DIRECT</div>
    <div class="scoreline">
      <div class="team" id="teamA">ÉQUIPE 1</div>
      <div class="score"><span id="scoreA">0</span><span class="dash">:</span><span id="scoreB">0</span></div>
      <div class="team right" id="teamB">ÉQUIPE 2</div>
    </div>
    <div id="matchStatus">EN ATTENTE</div>
  </section>

  <main id="admin">
    <div class="adminHead">
      <div><h1>ALZ CUP — Administration</h1><p>Modifie le score depuis ton PC. L'overlay OBS se met à jour automatiquement.</p></div>
      <button class="secondary" id="logoutBtn" type="button" style="display:none">Déconnexion</button>
    </div>
    <div id="loginPanel">
      <label for="email">Adresse e-mail Firebase</label>
      <input id="email" type="email" autocomplete="username" placeholder="Ton e-mail">
      <label for="password">Mot de passe</label>
      <input id="password" type="password" autocomplete="current-password" placeholder="Ton mot de passe">
      <button id="loginBtn" type="button">Se connecter</button>
    </div>
    <div id="editorPanel">
      <div class="grid">
        <div><label for="titleInput">Nom du match / manche</label><input id="titleInput" maxlength="45" value="MATCH EN DIRECT"></div>
        <div><label for="statusInput">Statut</label><input id="statusInput" maxlength="30" value="EN ATTENTE"></div>
        <div><label for="teamAInput">Équipe de gauche</label><input id="teamAInput" maxlength="24" value="ÉQUIPE 1"></div>
        <div><label for="teamBInput">Équipe de droite</label><input id="teamBInput" maxlength="24" value="ÉQUIPE 2"></div>
      </div>
      <div class="scores">
        <div><label for="scoreAInput">Score équipe gauche</label><input id="scoreAInput" type="number" min="0" max="999" value="0"></div>
        <div><label for="scoreBInput">Score équipe droite</label><input id="scoreBInput" type="number" min="0" max="999" value="0"></div>
      </div>
      <button id="saveBtn" type="button">PUBLIER LE SCORE</button>
      <button id="resetBtn" class="secondary" type="button">Remettre à zéro</button>
    </div>
    <div id="message" role="status"></div>
  </main>

  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
  <script>
    // Configuration du projet Firebase ALZ CUP ONLINE
    const firebaseConfig = {
      apiKey: "AIzaSyDQ6ShueCtCdfOfpfnRxbR9ij12HVRV7Ec",
      authDomain: "alz-cup-online-5.firebaseapp.com",
      databaseURL: "https://alz-cup-online-5-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "alz-cup-online-5",
      storageBucket: "alz-cup-online-5.firebasestorage.app",
      messagingSenderId: "134697377243",
      appId: "1:134697377243:web:8597b659e0ac74eb7a9bfe",
      measurementId: "G-KCVLYB0E40"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.database();
    const matchRef = db.ref("match");
    const isAdminPage = new URLSearchParams(location.search).get("admin") === "1";

    const $ = id => document.getElementById(id);
    const message = text => { $("message").textContent = text; };

    if (isAdminPage) {
      document.body.classList.add("admin-mode");
      $("overlay").style.display = "none";
      $("admin").style.display = "block";
      $("loginPanel").style.display = "block";
    }

    // Écoute en temps réel : les changements Firebase s'affichent immédiatement sur OBS.
    matchRef.on("value", snapshot => {
      const data = snapshot.val() || {};
      $("matchTitle").textContent = data.title || "MATCH EN DIRECT";
      $("teamA").textContent = data.teamA || "ÉQUIPE 1";
      $("teamB").textContent = data.teamB || "ÉQUIPE 2";
      $("scoreA").textContent = Number.isFinite(Number(data.scoreA)) ? Number(data.scoreA) : 0;
      $("scoreB").textContent = Number.isFinite(Number(data.scoreB)) ? Number(data.scoreB) : 0;
      $("matchStatus").textContent = data.status || "EN ATTENTE";

      if (isAdminPage && data && Object.keys(data).length) {
        $("titleInput").value = data.title || "MATCH EN DIRECT";
        $("statusInput").value = data.status || "EN ATTENTE";
        $("teamAInput").value = data.teamA || "ÉQUIPE 1";
        $("teamBInput").value = data.teamB || "ÉQUIPE 2";
        $("scoreAInput").value = Number(data.scoreA) || 0;
        $("scoreBInput").value = Number(data.scoreB) || 0;
      }
    }, error => {
      if (isAdminPage) message("Erreur de lecture Firebase : " + error.message);
      else console.error("Firebase :", error);
    });

    if (isAdminPage) {
      $("loginBtn").addEventListener("click", async () => {
        message("Connexion en cours…");
        try {
          await auth.signInWithEmailAndPassword($("email").value.trim(), $("password").value);
          message("Connecté. Tu peux modifier le score.");
        } catch (error) { message("Connexion impossible : " + error.message); }
      });

      auth.onAuthStateChanged(user => {
        $("loginPanel").style.display = user ? "none" : "block";
        $("editorPanel").style.display = user ? "block" : "none";
        $("logoutBtn").style.display = user ? "inline-block" : "none";
        if (user) message("Connecté à Firebase.");
      });

      $("logoutBtn").addEventListener("click", () => auth.signOut());

      async function publish(scoresOnly = false) {
        if (!auth.currentUser) { message("Connecte-toi avant de publier."); return; }
        const safeNumber = id => Math.max(0, Math.min(999, Math.floor(Number($(id).value) || 0)));
        const data = {
          title: $("titleInput").value.trim() || "MATCH EN DIRECT",
          status: $("statusInput").value.trim() || "EN ATTENTE",
          teamA: $("teamAInput").value.trim() || "ÉQUIPE 1",
          teamB: $("teamBInput").value.trim() || "ÉQUIPE 2",
          scoreA: safeNumber("scoreAInput"),
          scoreB: safeNumber("scoreBInput"),
          updatedAt: firebase.database.ServerValue.TIMESTAMP
        };
        $("saveBtn").disabled = true;
        message("Publication du score…");
        try {
          await matchRef.set(data);
          message("Score publié ! L'overlay OBS est actualisé.");
        } catch (error) {
          message("Échec de publication : " + error.message + " — Vérifie les règles Firebase.");
        } finally { $("saveBtn").disabled = false; }
      }

      $("saveBtn").addEventListener("click", () => publish());
      $("resetBtn").addEventListener("click", () => {
        $("scoreAInput").value = 0;
        $("scoreBInput").value = 0;
        publish();
      });
    }
  </script>
</body>
</html>
