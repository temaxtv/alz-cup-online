<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ALZ CUP – Mode TV</title>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&family=Rubik:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#07031a;--card:rgba(20,10,48,.72);--fg:#f4f1ff;--mut:#a79bd0;--line:rgba(166,60,255,.45);--pur:#a63cff;--mag:#ff2bd6;--blu:#2d7bff;--yel:#ffb300;color-scheme:dark}
*{box-sizing:border-box}
html{font-size:clamp(12px,1.9vh,44px);background:var(--bg);height:100%;overflow:hidden}
body{margin:0;height:100%;color:var(--fg);font:1rem/1.35 "Rubik",system-ui,sans-serif;overflow:hidden;
background:radial-gradient(900px 500px at 85% -5%,rgba(166,60,255,.35),transparent 60%),radial-gradient(700px 500px at 0% 20%,rgba(45,123,255,.25),transparent 60%),radial-gradient(900px 600px at 50% 110%,rgba(255,43,214,.25),transparent 60%),var(--bg)}
body.transp,body.transp html{background:transparent!important}
body.transp{background:transparent!important}
#app{height:100vh;display:flex;flex-direction:column;padding:2vh 3vw 2.5vh}
header{display:flex;align-items:center;justify-content:space-between;gap:1rem}
.logo{font-family:"Permanent Marker",cursive;font-style:italic;font-size:3.2rem;line-height:1;transform:rotate(-2deg);text-shadow:0 0 14px var(--blu),0 0 30px var(--pur)}
.logo b{color:var(--mag);font-weight:400;text-shadow:0 0 14px var(--mag),0 0 30px var(--pur)}
.live{font-size:.95rem;color:var(--mut)}
.live i{display:inline-block;width:.7rem;height:.7rem;border-radius:50%;background:#7dffb0;margin-right:.4rem;box-shadow:0 0 10px #7dffb0}
.live.off i{background:#ff8a5c;box-shadow:0 0 10px #ff8a5c}
#bandeau{color:var(--mut);font-size:1.05rem;text-align:center;margin:.6rem 0 0}
#champ{color:var(--yel);font-weight:600;text-align:center;min-height:1.4rem;font-size:1.15rem}
#stage{flex:1;position:relative;min-height:0;margin-top:1rem}
.slide{position:absolute;inset:0;opacity:0;pointer-events:none;transition:opacity .7s;display:flex;flex-direction:column;overflow:hidden}
.slide.on{opacity:1}
h2{font-family:"Permanent Marker",cursive;font-style:italic;font-weight:400;font-size:2rem;color:#fff;text-shadow:0 0 12px var(--pur);margin:0 0 1rem}
h2::after{content:"";display:block;height:4px;width:7rem;margin-top:.4rem;background:linear-gradient(90deg,var(--mag),transparent);border-radius:3px}
.card{background:var(--card);border:1px solid var(--line);border-radius:1.1rem;padding:1rem;box-shadow:0 0 22px rgba(166,60,255,.15) inset}
.dot{width:.9rem;height:.9rem;border-radius:50%;flex:none;box-shadow:0 0 10px currentColor;display:inline-block}
.row{display:flex;align-items:center;gap:.7rem}
/* classement */
#rankList{display:flex;flex-direction:column;gap:.9rem;flex:1;justify-content:center}
.rank{position:relative;display:grid;grid-template-columns:4rem 1fr auto;gap:1.2rem;align-items:center;padding:1.2rem 1.6rem;border-radius:1.3rem;background:var(--card);border:1px solid var(--line);overflow:hidden}
.rank:first-child{border-color:var(--yel);box-shadow:0 0 30px rgba(255,179,0,.35)}
.rank .bar{position:absolute;left:0;top:0;bottom:0;opacity:.28;transition:width .8s}
.rank>*{position:relative}
.rank .pos{font-size:2.6rem;font-weight:800;text-align:center}
.rank .tn{font-weight:800;font-size:2.2rem;line-height:1.1}
.rank .pl{font-size:1.1rem;color:var(--mut);margin-top:.2rem}
.rank .pts{font-family:"Permanent Marker",cursive;font-size:3.6rem;text-shadow:0 0 14px var(--mag);font-variant-numeric:tabular-nums}
/* joueurs */
#playersGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:1rem;flex:1;align-content:center}
#playersGrid .card{padding:1.1rem}
#playersGrid .tn{font-weight:800;font-size:1.5rem}
#playersGrid .pl{font-size:.95rem;color:var(--mut)}
#playersGrid .pts{font-family:"Permanent Marker",cursive;font-size:2.4rem;text-shadow:0 0 12px var(--mag)}
/* recap */
#recapBox table{width:100%;border-collapse:collapse;font-size:1.25rem}
#recapBox th,#recapBox td{padding:.5rem .7rem;text-align:center;border-bottom:1px solid rgba(166,60,255,.25)}
#recapBox td:first-child,#recapBox th:first-child{text-align:left}
#recapBox .mx{color:var(--yel);font-weight:800}
#recapBox tr.tot td{font-size:1.5rem;font-weight:800;border-bottom:0}
/* planning */
#planList{display:flex;flex-direction:column;gap:.7rem;justify-content:center;flex:1}
.pi{display:grid;grid-template-columns:8rem 1fr;gap:1rem}
.pt{border-radius:1.1rem;border:1px solid var(--line);background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:.5rem;font-family:"Permanent Marker",cursive;font-size:2.2rem;line-height:1;text-shadow:0 0 12px var(--mag)}
.pt small{font-family:"Rubik",sans-serif;font-size:.75rem;color:var(--mut);text-shadow:none;margin-top:.4rem;text-transform:uppercase;letter-spacing:.06em}
.pt.no{color:var(--mut);text-shadow:none}
.pc{border-radius:1.1rem;border:1px solid var(--line);border-left:6px solid var(--pur);background:var(--card);padding:.7rem 1.1rem;min-width:0}
.pn{font-weight:800;font-size:1.6rem}
.pm{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:.4rem}
.tg{font-size:.95rem;padding:.1rem .7rem;border-radius:99px;border:1px solid var(--line);color:var(--mut)}
.tg.hot{color:var(--yel);border-color:var(--yel)}
.tg.ok{color:#7dffb0;border-color:rgba(125,255,176,.5)}
.pi.done{opacity:.6}.pi.done .pc{border-left-color:#7dffb0}
.pi.next .pt,.pi.next .pc{border-color:var(--yel);box-shadow:0 0 24px rgba(255,179,0,.35)}.pi.next .pc{border-left-color:var(--yel)}
/* chart */
#chartBox{flex:1;display:flex;flex-direction:column;justify-content:center}
#chartBox svg{width:100%;height:auto;max-height:70vh}
.lg{display:flex;flex-wrap:wrap;gap:1.5rem;justify-content:center;margin-top:.8rem;font-size:1.2rem}
.empty{color:var(--mut);font-size:1.4rem;text-align:center;margin:auto}
footer{display:flex;justify-content:center;gap:.6rem;padding-top:.8rem}
footer i{width:.7rem;height:.7rem;border-radius:50%;background:rgba(255,255,255,.2);transition:.3s}
footer i.on{background:var(--mag);box-shadow:0 0 10px var(--mag)}
/* annonce score */
#alert{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;background:rgba(7,3,26,.88);backdrop-filter:blur(6px);opacity:0;pointer-events:none;transition:opacity .5s}
#alert.on{opacity:1}
#alert .box{width:min(82vw,60rem);text-align:center;transform:scale(.92);transition:transform .5s}
#alert.on .box{transform:scale(1)}
#alert .k{font-family:"Permanent Marker",cursive;font-size:1.6rem;color:var(--mag);text-shadow:0 0 14px var(--mag)}
#alert .g{font-family:"Permanent Marker",cursive;font-size:4.2rem;line-height:1.05;margin:.3rem 0 1.4rem;text-shadow:0 0 16px var(--blu),0 0 34px var(--pur)}
#alert .pd{display:grid;grid-template-columns:3.5rem 1fr auto auto;gap:1rem;align-items:center;text-align:left;padding:.9rem 1.4rem;margin-top:.7rem;border-radius:1.1rem;background:var(--card);border:1px solid var(--line);font-size:1.9rem}
#alert .pd:first-of-type{border-color:var(--yel);box-shadow:0 0 28px rgba(255,179,0,.4)}
#alert .pd b{font-weight:800}
#alert .pd .gain{font-family:"Permanent Marker",cursive;color:var(--yel);font-size:2.2rem}
#alert .pd .tot{color:var(--mut);font-size:1.3rem;min-width:7rem;text-align:right}
#alert .x{margin-top:1.4rem;font-family:"Permanent Marker",cursive;font-size:2.2rem;color:var(--yel);text-shadow:0 0 14px var(--yel)}
#conf{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:60}
#conf span{position:absolute;top:-40px;animation:fall 3.4s linear forwards}
@keyframes fall{to{transform:translateY(112vh) rotate(540deg)}}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="logo">ALZ <b>CUP</b></div>
    <div class="live off" id="live"><i></i><span id="liveTxt">Connexion…</span></div>
  </header>
  <div id="bandeau"></div>
  <div id="champ"></div>
  <div id="stage">
    <section class="slide" id="s0"><h2>Classement</h2><div id="rankList"></div></section>
    <section class="slide" id="s1"><h2>Joueurs · MVP</h2><div id="playersGrid"></div></section>
    <section class="slide" id="s2"><h2>Évolution des points</h2><div class="card" id="chartBox"></div></section>
    <section class="slide" id="s3"><h2>Récapitulatif par jeu</h2><div class="card" id="recapBox"></div></section>
    <section class="slide" id="s4"><h2>Planning</h2><div id="planList"></div></section>
  </div>
  <footer id="dots"></footer>
</div>
<div id="alert"><div class="box" id="alertBox"></div></div>
<div id="conf"></div>

<script>
(function(){
  /* ===== Réglages par l'URL =====
     ?t=12            secondes par écran (défaut 12)
     ?slides=0,3,4    écrans affichés : 0 classement, 1 joueurs, 2 graphique, 3 récap, 4 planning
     ?bg=transparent  fond transparent (incrustation OBS)
     ?alert=0         désactive l'annonce plein écran à chaque jeu terminé
  */
  var Q=new URLSearchParams(location.search);
  var T=Math.max(4,parseFloat(Q.get('t'))||12)*1000;
  var SL=(Q.get('slides')||'0,1,2,3,4').split(',').map(Number).filter(function(n){return n>=0&&n<=4;});
  if(!SL.length)SL=[0,1,2,3,4];
  var ALERT=Q.get('alert')!=='0';
  if(Q.get('bg')==='transparent')document.body.classList.add('transp');

  var COLORS=['#a63cff','#ff2bd6','#2d7bff','#ffb300'];
  var PL8=['—','1er','2e','3e','4e','5e','6e','7e','8e'];
  var PLACES=['—','1er','2e','3e','4e'];
  var S={teams:[],bareme:[10,6,3,1],baremeSolo:[10,8,6,5,4,3,2,1],games:[],cur:0};
  function z8(){return [0,0,0,0,0,0,0,0];}
  var PAIRS=[[0,1],[2,3],[0,2],[1,3],[0,3],[1,2]];
  var SEMI=[[[0,1],[2,3]],[[0,2],[1,3]],[[0,3],[1,2]]];
  var BET=2;
  function $(id){return document.getElementById(id);}
  function el(tag,attrs,parent){var e=document.createElement(tag);for(var k in attrs){if(k==='text')e.textContent=attrs[k];else e[k]=attrs[k];}if(parent)parent.appendChild(e);return e;}

  /* ---------- même logique de calcul que le site ---------- */
  function need(g){return Math.ceil((g.bo||3)/2);}
  function winner(g,key,a,b){
    var r=(g.m||{})[key]; if(!r||a<0||b<0)return -1;
    if(r[0]==null||r[1]==null||r[0]===''||r[1]==='')return -1;
    var x=+r[0],y=+r[1],n=need(g);
    if(x>=n&&x>y)return a;
    if(y>=n&&y>x)return b;
    return -1;
  }
  function cmp(a,b){for(var i=0;i<a.length;i++){if(a[i]!==b[i])return a[i]>b[i]?1:-1;}return 0;}
  function rankBy(fn){
    var k=[0,1,2,3].map(fn);
    return k.map(function(x,t){var c=0;k.forEach(function(y,u){if(u!==t&&cmp(y,x)>0)c++;});return c+1;});
  }
  function pouleStats(g){
    var st=[0,1,2,3].map(function(){return {w:0,gf:0,ga:0};}),done=0;
    PAIRS.forEach(function(p,i){
      var w=winner(g,'p'+i,p[0],p[1]); if(w<0)return;
      var r=g.m['p'+i]; done++; st[w].w++;
      st[p[0]].gf+=+r[0];st[p[0]].ga+=+r[1];st[p[1]].gf+=+r[1];st[p[1]].ga+=+r[0];
    });
    return {st:st,done:done};
  }
  function bracket(g){
    var p=SEMI[g.pair||0];
    var w1=winner(g,'s1',p[0][0],p[0][1]),w2=winner(g,'s2',p[1][0],p[1][1]);
    var l1=w1<0?-1:(w1===p[0][0]?p[0][1]:p[0][0]);
    var l2=w2<0?-1:(w2===p[1][0]?p[1][1]:p[1][0]);
    return {s1:p[0],s2:p[1],f:[w1,w2],t:[l1,l2]};
  }
  function rankN(v,low){return v.map(function(x,i){var c=0;v.forEach(function(w,j){if(j!==i&&(low?w<x:w>x))c++;});return c+1;});}
  function soloPl(g){
    var sp=g.sp||z8(),ss=g.ss||[];
    if((g.smode||'place')==='place')return sp.slice();
    if(ss.length<8||ss.some(function(v){return v===null||v===''||isNaN(+v);}))return z8();
    return rankN(ss.map(Number),g.low);
  }
  function soloPts(g,p){var q=soloPl(g)[p];return q>0?(Number(S.baremeSolo[q-1])||0)*(g.coef||1):0;}
  function soloTeamPts(g,t){return soloPts(g,2*t)+soloPts(g,2*t+1);}
  function pname(p){var t=S.teams[p>>1];return t?t[p%2?'p2':'p1']:'';}
  function derive(g){
    var pl=[0,0,0,0];
    if(g.solo){
      if(!soloPl(g).some(function(p){return p>0;}))return pl;
      var tp=[0,1,2,3].map(function(t){return soloTeamPts(g,t);});
      return rankBy(function(t){return [tp[t]];});
    }
    var mode=g.mode||'place';
    if(mode==='place')return (g.places||pl).slice();
    if(mode==='score'){
      var sc=g.scores||[];
      if(sc.length<4||sc.some(function(v){return v===null||v===''||isNaN(+v);}))return pl;
      return rankBy(function(t){return [g.low?-sc[t]:+sc[t]];});
    }
    if(mode==='poule'){
      var ps=pouleStats(g); if(ps.done<6)return pl;
      return rankBy(function(t){var s=ps.st[t];return [s.w,s.gf-s.ga,s.gf];});
    }
    var b=bracket(g);
    var wf=winner(g,'f',b.f[0],b.f[1]),wp=winner(g,'p',b.t[0],b.t[1]);
    if(wf>=0&&wp>=0){
      pl[wf]=1;pl[wf===b.f[0]?b.f[1]:b.f[0]]=2;
      pl[wp]=3;pl[wp===b.t[0]?b.t[1]:b.t[0]]=4;
    }
    return pl;
  }
  function hasRes(g){return derive(g).some(function(p){return p>0;});}
  function complete(g){
    if(g.solo)return soloPl(g).every(function(p){return p>0;});
    var pl=derive(g);return pl.every(function(p){return p>0;});
  }
  function gamePts(g,t){
    var b=g.solo?soloTeamPts(g,t):(function(){var p=derive(g)[t];return p>0?(Number(S.bareme[p-1])||0)*(g.coef||1):0;})();
    return g.joker===t?b*2:b;
  }
  function betPts(g,t){var pl=derive(g);return (g.bets&&g.bets[t]>=0&&pl[g.bets[t]]===1)?BET:0;}
  function scores(){
    var res=S.teams.map(function(t,i){return {i:i,total:0,wins:0,last:0};});
    var lastIdx=-1;
    S.games.forEach(function(g,gi){if(hasRes(g))lastIdx=gi;});
    S.games.forEach(function(g,gi){
      var pl=derive(g);
      res.forEach(function(r){
        r.total+=gamePts(g,r.i)+betPts(g,r.i);
        if(pl[r.i]===1)r.wins++;
        if(gi===lastIdx)r.last=gamePts(g,r.i);
      });
    });
    return res;
  }
  function sorted(){return scores().sort(function(a,b){return b.total-a.total||b.wins-a.wins||b.last-a.last;});}
  function playerPts(){var pt=z8();S.games.forEach(function(g){if(g.solo)for(var p=0;p<8;p++)pt[p]+=soloPts(g,p);});return pt;}
  function soloWins(){var w={};S.games.forEach(function(g){if(!g.solo)return;var pl=soloPl(g);for(var p=0;p<8;p++)if(pl[p]===1)(w[p]=w[p]||[]).push(g.name);});return w;}
  function remMax(t){
    var bases=[],used=false;
    S.games.forEach(function(g){
      if(g.joker===t)used=true;
      if(hasRes(g))return;
      var b=g.solo?((+S.baremeSolo[0]||0)+(+S.baremeSolo[1]||0))*(g.coef||1):(+S.bareme[0]||0)*(g.coef||1);
      bases.push(g.joker===t?b*2:b);
    });
    var sum=bases.reduce(function(a,b){return a+b;},0)+bases.length*BET;
    return sum+(used||!bases.length?0:Math.max.apply(null,bases));
  }
  function champOf(r){
    if(!(r[0].total>0))return -1;
    var L=r[0];
    for(var k=1;k<r.length;k++){if(!(L.total>r[k].total+remMax(r[k].i)))return -1;}
    return L.i;
  }

  /* ---------- rendu ---------- */
  var prevPts={};
  function nm(t){return (t.emoji?t.emoji+' ':'')+t.name;}
  function countUp(n,a,b){if(a==null||a===b||!window.requestAnimationFrame)return;var t0=null;function f(ts){if(t0===null)t0=ts;var p=Math.min(1,(ts-t0)/900);n.textContent=Math.round(a+(b-a)*p)+' pts';if(p<1)window.requestAnimationFrame(f);}window.requestAnimationFrame(f);}
  function flip(row,oldTop){try{if(oldTop==null)return;var d=oldTop-row.getBoundingClientRect().top;if(!d)return;row.style.transition='none';row.style.transform='translateY('+d+'px)';window.requestAnimationFrame(function(){window.requestAnimationFrame(function(){row.style.transition='transform .7s ease';row.style.transform='';});});}catch(e){}}

  function renderRank(){
    var box=$('rankList'),old={};
    try{Array.prototype.forEach.call(box.children,function(ch){old[ch.getAttribute('data-t')]=ch.getBoundingClientRect().top;});}catch(e){}
    box.innerHTML='';
    var r=sorted(),max=Math.max.apply(null,r.map(function(x){return x.total;}).concat([1])),medals=['🥇','🥈','🥉','4'];
    r.forEach(function(x,k){
      var t=S.teams[x.i];
      var row=el('div',{className:'rank'},box);row.setAttribute('data-t',x.i);
      var bar=el('div',{className:'bar'},row);bar.style.width=(x.total/max*100)+'%';bar.style.background=COLORS[x.i];
      el('div',{className:'pos',text:medals[k]},row);
      var mid=el('div',{},row);
      el('div',{className:'tn',text:nm(t)},mid);
      el('div',{className:'pl',text:t.p1+' & '+t.p2+' · '+x.wins+(x.wins>1?' victoires':' victoire')+(k>0&&r[0].total>x.total?' · −'+(r[0].total-x.total)+' pts du leader':'')+(S.games.some(function(g){return g.joker===x.i;})?' · 🃏 joué':' · 🃏 dispo')},mid);
      var pe=el('div',{className:'pts',text:x.total+' pts'},row);
      countUp(pe,prevPts[x.i],x.total);prevPts[x.i]=x.total;flip(row,old[x.i]);
    });
  }
  function renderBandeau(){
    var li=-1;S.games.forEach(function(g,i){if(hasRes(g))li=i;});
    var nx=S.games.filter(function(g){return !hasRes(g);})[0],eta='';
    if(nx&&nx.time){var m=/^(\d\d):(\d\d)/.exec(nx.time);if(m){var d=new Date();d.setHours(+m[1],+m[2],0,0);var mn=Math.round((d-new Date())/60000);eta=' à '+nx.time+(mn>0?' (dans '+(mn>=60?Math.floor(mn/60)+' h '+(mn%60)+' min':mn+' min')+')':mn>-5?' (c’est l’heure !)':' (en retard)');}}
    var w='';if(li>=0){var pl=derive(S.games[li]),wi=pl.indexOf(1);if(wi>=0)w=' (🥇 '+S.teams[wi].name+')';}
    $('bandeau').textContent='Dernier jeu : '+(li>=0?S.games[li].name+w:'—')+'  ·  Prochain : '+(nx?nx.name+eta:'c’est fini !');
    var r=sorted(),done=S.games.length>0&&S.games.every(hasRes),ch=champOf(r);
    $('champ').textContent=done?'🏁 Terminé ! Champion : '+S.teams[r[0].i].name:(ch>=0?'🔒 '+S.teams[ch].name+' est champion mathématique !':'');
  }
  function renderPlayers(){
    var pb=$('playersGrid');pb.innerHTML='';var pt=playerPts();
    var sw=soloWins(),minPt=Math.min.apply(null,pt),maxPt=Math.max.apply(null,pt),anySolo=S.games.some(function(g){return g.solo&&soloPl(g).some(function(q){return q>0;});});
    function bdg(p,k){var b=[];if(k===0&&pt[p]>0)b.push('🏆 MVP');if(sw[p])b.push('👑 '+sw[p].slice(0,2).join(', '));if(anySolo&&pt[p]===minPt&&minPt<maxPt)b.push('🥄 Cuillère de bois');return b.length?' · '+b.join(' · '):'';}
    [0,1,2,3,4,5,6,7].sort(function(a,b){return pt[b]-pt[a]||a-b;}).forEach(function(p,k){
      var c=el('div',{className:'card'},pb),r=el('div',{className:'row'},c);
      var d=el('span',{className:'dot'},r);d.style.background=COLORS[p>>1];d.style.color=COLORS[p>>1];
      var m=el('div',{},r);m.style.flex='1';
      el('div',{className:'tn',text:(k===0&&pt[p]>0?'👑 ':'')+pname(p)},m);
      el('div',{className:'pl',text:(S.teams[p>>1].emoji||'')+' '+S.teams[p>>1].name+bdg(p,k)},m);
      el('div',{className:'pts',text:pt[p]},r);
    });
  }
  function renderRecap(){
    var rc=$('recapBox');rc.innerHTML='';
    var played=S.games.filter(hasRes);
    if(!played.length){el('div',{className:'empty',text:'Le récapitulatif apparaîtra après le premier jeu.'},rc);return;}
    var tb=el('table',{},rc),hr=el('tr',{},tb);
    el('th',{text:'Jeu'},hr);S.teams.forEach(function(t){el('th',{text:nm(t)},hr);});
    played.slice(-9).forEach(function(g){
      var tr=el('tr',{},tb),v=[0,1,2,3].map(function(t){return gamePts(g,t)+betPts(g,t);}),mx=Math.max.apply(null,v);
      el('td',{text:g.name+(g.solo?' (solo)':'')+' ×'+(g.coef||1)},tr);
      v.forEach(function(x,t){el('td',{text:x+(g.joker===t&&x?' 🃏':'')+(betPts(g,t)?' 🔮':''),className:x===mx&&x>0?'mx':''},tr);});
    });
    var tt=el('tr',{className:'tot'},tb);el('td',{text:'TOTAL'},tt);
    scores().forEach(function(x){el('td',{text:x.total,className:'mx'},tt);});
  }
  function renderChart(){
    var ch=$('chartBox');ch.innerHTML='';
    var played=S.games.filter(hasRes);
    if(!played.length){el('div',{className:'empty',text:'Le graphique apparaîtra après le premier jeu.'},ch);return;}
    var run=[0,0,0,0],ser=[[0],[0],[0],[0]];
    played.forEach(function(g){[0,1,2,3].forEach(function(t){run[t]+=gamePts(g,t)+betPts(g,t);ser[t].push(run[t]);});});
    var W=900,H=380,P=34,B=80,N=played.length,mx2=Math.max.apply(null,run.concat([1]));
    function X(i){return P+i*(W-2*P)/N;}function Y(v){return H-B-v/mx2*(H-P-B);}
    var s='<svg viewBox="0 0 '+W+' '+H+'"><line x1="'+P+'" y1="'+(H-B)+'" x2="'+(W-P)+'" y2="'+(H-B)+'" stroke="#a79bd0" stroke-opacity=".4"/>';
    for(var i=1;i<=N;i++){var n=(played[i-1].name||'Jeu').slice(0,10).replace(/&/g,'&amp;').replace(/</g,'&lt;');s+='<text x="'+X(i)+'" y="'+(H-B+16)+'" fill="#a79bd0" font-size="14" text-anchor="end" transform="rotate(-40 '+X(i)+' '+(H-B+16)+')">'+n+'</text>';}
    ser.forEach(function(a,t){
      s+='<polyline fill="none" stroke="'+COLORS[t]+'" stroke-width="4" stroke-linejoin="round" points="'+a.map(function(v,i){return X(i)+','+Y(v);}).join(' ')+'"/>';
      s+='<circle cx="'+X(N)+'" cy="'+Y(a[N])+'" r="6" fill="'+COLORS[t]+'"/>';
    });
    ch.innerHTML=s+'</svg>';
    var lg=el('div',{className:'lg'},ch);
    S.teams.forEach(function(t,i){var l=el('span',{className:'row'},lg);var d=el('span',{className:'dot'},l);d.style.background=COLORS[i];d.style.color=COLORS[i];l.appendChild(document.createTextNode(t.name));});
  }
  var MODL={place:'Classement',score:'Score / chrono',poule:'Poule',bracket:'Tournoi'};
  function renderPlan(){
    var box=$('planList');box.innerHTML='';
    var nx=S.games.filter(function(g){return !hasRes(g);})[0];
    var ni=nx?S.games.indexOf(nx):S.games.length;
    var start=Math.max(0,Math.min(ni-1,S.games.length-7)),list=S.games.slice(start,start+7);
    list.forEach(function(g){
      var done=hasRes(g),isNext=g===nx;
      var it=el('div',{className:'pi'+(done?' done':'')+(isNext?' next':'')},box);
      var t=el('div',{className:'pt'+(g.time?'':' no')},it);
      t.appendChild(document.createTextNode(g.time||'--:--'));
      el('small',{text:done?'Terminé':isNext?'Prochain':'À venir'},t);
      var c=el('div',{className:'pc'},it);
      el('div',{className:'pn',text:(done?'✅ ':isNext?'🎮 ':'')+(g.name||'Jeu')},c);
      var m=el('div',{className:'pm'},c);
      el('span',{className:'tg',text:g.solo?'Solo · 8 joueurs':'Équipes · '+(MODL[g.mode]||'')+((g.mode==='poule'||g.mode==='bracket')?' BO'+g.bo:'')},m);
      if(g.coef>1)el('span',{className:'tg hot',text:'×'+g.coef+' points'},m);
      if(g.joker>=0&&S.teams[g.joker])el('span',{className:'tg hot',text:'🃏 '+S.teams[g.joker].name},m);
      if(done){var w=derive(g).indexOf(1);if(w>=0)el('span',{className:'tg ok',text:'🥇 '+S.teams[w].name},m);}
    });
    if(!S.games.length)el('div',{className:'empty',text:'Aucun jeu.'},box);
  }
  function renderAll(){
    if(!S.teams.length)return;
    renderRank();renderBandeau();renderPlayers();renderRecap();renderChart();renderPlan();
  }

  /* ---------- rotation des écrans ---------- */
  var idx=0,hold=0;
  var dots=$('dots');
  SL.forEach(function(){el('i',{},dots);});
  function showSlide(){
    for(var i=0;i<5;i++)$('s'+i).classList.toggle('on',i===SL[idx]);
    Array.prototype.forEach.call(dots.children,function(d,i){d.classList.toggle('on',i===idx);});
  }
  showSlide();
  setInterval(function(){
    if(Date.now()<hold)return;
    idx=(idx+1)%SL.length;showSlide();
  },T);
  setInterval(function(){if(S.teams.length)renderBandeau();},30000);
  function goRank(ms){
    var k=SL.indexOf(0);if(k<0)k=0;
    idx=k;showSlide();hold=Date.now()+ms;
  }

  /* ---------- annonce à chaque jeu terminé ---------- */
  function confetti(){
    var c=$('conf');c.innerHTML='';var em=['🎉','✨','👑','🎊'];
    for(var k=0;k<48;k++){var s=el('span',{text:em[k%4]},c);s.style.left=(Math.random()*100)+'vw';s.style.animationDelay=(Math.random()*1.4)+'s';s.style.fontSize=(22+Math.random()*26)+'px';}
    setTimeout(function(){c.innerHTML='';},5200);
  }
  var alertTimer=null;
  function showAlert(g,extra){
    var box=$('alertBox');box.innerHTML='';
    el('div',{className:'k',text:'🎮 Jeu terminé !'},box);
    el('div',{className:'g',text:g.name||'Jeu'},box);
    var pl=derive(g),tot=scores(),medals=['','🥇','🥈','🥉','4'];
    [0,1,2,3].sort(function(a,b){return pl[a]-pl[b];}).forEach(function(t){
      var row=el('div',{className:'pd'},box);
      el('span',{text:medals[pl[t]]||''},row);
      el('b',{text:nm(S.teams[t])},row);
      el('span',{className:'gain',text:'+'+(gamePts(g,t)+betPts(g,t))},row);
      el('span',{className:'tot',text:tot[t].total+' pts'},row);
    });
    if(extra)el('div',{className:'x',text:extra},box);
    $('alert').classList.add('on');confetti();
    clearTimeout(alertTimer);
    alertTimer=setTimeout(function(){$('alert').classList.remove('on');goRank(12000);},9000);
  }

  /* ---------- détection des changements ---------- */
  var prevSig=null,prevLead=null,pending=null,pendTimer=null,finalShown=false;
  function sig(g){return JSON.stringify([derive(g),[0,1,2,3].map(function(t){return gamePts(g,t)+betPts(g,t);})]);}
  function detect(){
    var cur={};S.games.forEach(function(g){cur[g.id]=sig(g);});
    var r=sorted(),lead=r[0]&&r[0].total>0?r[0].i:-1;
    if(prevSig!==null){
      var changed=S.games.filter(function(g){return prevSig[g.id]!==undefined&&prevSig[g.id]!==cur[g.id]&&hasRes(g)&&complete(g);});
      if(changed.length){
        var g=changed[changed.length-1];
        var done=S.games.length>0&&S.games.every(hasRes);
        var extra='';
        if(done&&!finalShown){finalShown=true;extra='🏆 '+S.teams[r[0].i].name+' remporte l’ALZ CUP !';}
        else if(lead>=0&&prevLead!==null&&lead!==prevLead)extra='👑 '+S.teams[lead].name+' prend la tête !';
        if(!done)finalShown=false;
        pending={g:g,extra:extra};
        clearTimeout(pendTimer);
        pendTimer=setTimeout(function(){var p=pending;pending=null;if(ALERT&&p)showAlert(p.g,p.extra);else goRank(12000);},1200);
      }
    }
    prevSig=cur;prevLead=lead;
  }

  /* ---------- Firebase (lecture seule) ---------- */
  function live(ok,txt){var l=$('live');l.className='live'+(ok?'':' off');$('liveTxt').textContent=txt;}
  try{
    firebase.initializeApp({
      apiKey:"AIzaSyDQ6ShueCtCdfOfpfnRxbR9ij12HVRV7Ec",
      authDomain:"alz-cup-online-5.firebaseapp.com",
      projectId:"alz-cup-online-5",
      storageBucket:"alz-cup-online-5.firebasestorage.app",
      messagingSenderId:"134697377243",
      appId:"1:134697377243:web:8597b659e0ac74eb7a9bfe"
    });
    firebase.firestore().collection('alzcup_live').onSnapshot(function(snap){
      var meta=null,gm={};
      snap.forEach(function(d){
        var j=(d.data()||{}).json;if(!j)return;
        var o;try{o=JSON.parse(j);}catch(e){return;}
        if(d.id==='meta')meta=o;else if(d.id.indexOf('g_')===0)gm[d.id.slice(2)]=o;
      });
      if(!meta){live(true,'En attente des données…');return;}
      S.teams=meta.teams||[];
      S.bareme=meta.bareme||S.bareme;
      S.baremeSolo=meta.baremeSolo||S.baremeSolo;
      S.games=(meta.order||[]).filter(function(id){return gm[id];}).map(function(id){var g=gm[id];g.id=id;return g;});
      live(true,'En direct');
      renderAll();
      detect();
    },function(){live(false,'Synchro indisponible');});
  }catch(e){live(false,'Erreur Firebase');}
})();
</script>
