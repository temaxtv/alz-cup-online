<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ALZ CUP – Transition</title>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&family=Rubik:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#07031a;--fg:#f4f1ff;--mut:#a79bd0;--pur:#a63cff;--mag:#ff2bd6;--blu:#2d7bff;--yel:#ffb300}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:transparent!important}
body{font-family:"Rubik",system-ui,sans-serif;color:var(--fg)}

/* écran central (logo) */
#card{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;opacity:0;visibility:hidden;
background:radial-gradient(900px 500px at 85% -5%,rgba(166,60,255,.45),transparent 60%),radial-gradient(700px 500px at 0% 20%,rgba(45,123,255,.35),transparent 60%),radial-gradient(900px 600px at 50% 110%,rgba(255,43,214,.35),transparent 60%),var(--bg)}
#card.show{opacity:1;visibility:visible}
.crown{font-size:11vh;filter:drop-shadow(0 0 2vh var(--yel));transform:rotate(-12deg) translateY(-30vh);opacity:0;margin-bottom:-2vh}
.logo{font-family:"Permanent Marker",cursive;font-style:italic;font-size:30vh;line-height:.92;margin:0;transform:rotate(-3deg);letter-spacing:.3vh}
.logo .a,.logo .b{display:block;opacity:0}
.logo .a{color:#fff;text-shadow:0 0 1vh #fff,0 0 4vh var(--blu),0 0 8vh var(--pur)}
.logo .b{color:var(--mag);margin-top:-1.5vh;text-shadow:0 0 1.4vh var(--mag),0 0 5vh var(--pur),0 0 10vh var(--pur)}
.tag{font-family:"Permanent Marker",cursive;font-style:italic;font-size:4.4vh;margin-top:3vh;text-shadow:0 0 2vh var(--blu);opacity:0}
.line{font-family:"Permanent Marker",cursive;font-style:italic;font-size:5.4vh;margin-top:3.2vh;color:var(--yel);text-shadow:0 0 2vh var(--yel);opacity:0}
.game{font-size:3vh;margin-top:1.4vh;color:var(--mut);opacity:0}
.game b{color:#fff}
.neon{position:absolute;left:0;right:0;height:.5vh;background:linear-gradient(90deg,transparent,var(--mag),var(--pur),transparent);box-shadow:0 0 2vh var(--mag);opacity:0;transform:scaleX(0)}
.neon.t{top:14vh}.neon.b{bottom:14vh}
#card.in .crown{animation:crown .7s cubic-bezier(.2,1.4,.4,1) .05s forwards}
#card.in .logo .a{animation:popL .6s cubic-bezier(.2,1.3,.4,1) .15s forwards}
#card.in .logo .b{animation:popR .6s cubic-bezier(.2,1.3,.4,1) .3s forwards}
#card.in .tag{animation:fadeUp .5s ease .6s forwards}
#card.in .line{animation:fadeUp .5s ease .75s forwards}
#card.in .game{animation:fadeUp .5s ease .9s forwards}
#card.in .neon{animation:neon .6s ease .1s forwards}
#card.in .logo{animation:glow 1.6s ease-in-out .8s infinite alternate}
@keyframes crown{to{transform:rotate(-12deg) translateY(0);opacity:1}}
@keyframes popL{from{opacity:0;transform:translateX(-20vw) scale(.7)}to{opacity:1;transform:none}}
@keyframes popR{from{opacity:0;transform:translateX(20vw) scale(.7)}to{opacity:1;transform:none}}
@keyframes fadeUp{from{opacity:0;transform:translateY(3vh)}to{opacity:1;transform:none}}
@keyframes neon{to{opacity:1;transform:scaleX(1)}}
@keyframes glow{from{filter:brightness(1)}to{filter:brightness(1.25) drop-shadow(0 0 2vh rgba(255,43,214,.7))}}

/* bandes qui balaient l'écran */
.bar{position:fixed;top:-10vh;left:0;width:300vw;height:120vh;transform:translateX(-100%) skewX(-12deg);will-change:transform}
.bar:nth-child(1){background:linear-gradient(90deg,#7a1fd6,#a63cff);box-shadow:0 0 6vh var(--pur)}
.bar:nth-child(2){background:linear-gradient(90deg,#d41cb0,#ff2bd6);box-shadow:0 0 6vh var(--mag)}
.bar:nth-child(3){background:linear-gradient(90deg,#1b5fd8,#2d7bff);box-shadow:0 0 6vh var(--blu)}
.bar:nth-child(4){background:linear-gradient(90deg,#e09a00,#ffb300);box-shadow:0 0 6vh var(--yel)}
.bar:nth-child(5){background:var(--bg)}
#flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none}
</style>
</head>
<body>
<div id="card">
  <div class="neon t"></div><div class="neon b"></div>
  <span class="crown">👑</span>
  <h1 class="logo"><span class="a">ALZ</span><span class="b">CUP</span></h1>
  <div class="tag">Gaming · Fun · Live</div>
  <div class="line" id="line" style="display:none"></div>
  <div class="game" id="game" style="display:none"></div>
</div>
<div id="bars"><div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div></div>
<div id="flash"></div>

<script>
(function(){
  /* ===== Réglages par l'URL =====
     ?hold=1.2     secondes d'affichage du logo entre les deux balayages (défaut 1.2)
     ?stay=1       le logo reste affiché (écran de pause / début de stream)
     ?text=Pause   ligne de texte sous le logo (ex. Pause, On revient vite, Prochain jeu…)
     ?game=1       affiche « Jeu en cours : … » (lu en direct dans la base)
     ?speed=1      vitesse de l'animation (0.5 plus lent, 2 plus rapide)
     ?every=30     rejoue automatiquement toutes les 30 s (utile pour tester)
     Touche R ou Espace : rejoue (quand la page a le focus)
  */
  var Q=new URLSearchParams(location.search);
  var HOLD=Math.max(.3,parseFloat(Q.get('hold'))||1.2)*1000;
  var STAY=Q.get('stay')==='1';
  var SPEED=Math.min(3,Math.max(.4,parseFloat(Q.get('speed'))||1));
  var EVERY=parseFloat(Q.get('every'))||0;
  var DUR=1100/SPEED,STAG=90/SPEED;
  var card=document.getElementById('card'),bars=[].slice.call(document.querySelectorAll('.bar')),flash=document.getElementById('flash');

  var txt=Q.get('text');
  if(txt){var l=document.getElementById('line');l.textContent=txt.slice(0,60);l.style.display='';}
  var gameEl=document.getElementById('game');
  if(Q.get('game')==='1'){
    gameEl.style.display='';
    try{
      firebase.initializeApp({
        apiKey:"AIzaSyDQ6ShueCtCdfOfpfnRxbR9ij12HVRV7Ec",
        authDomain:"alz-cup-online-5.firebaseapp.com",
        projectId:"alz-cup-online-5",
        storageBucket:"alz-cup-online-5.firebasestorage.app",
        messagingSenderId:"134697377243",
        appId:"1:134697377243:web:8597b659e0ac74eb7a9bfe"
      });
      firebase.firestore().collection('alzcup_live').onSnapshot(function(snap){
        var meta=null,gm={};
        snap.forEach(function(d){
          var j=(d.data()||{}).json;if(!j)return;
          var o;try{o=JSON.parse(j);}catch(e){return;}
          if(d.id==='meta')meta=o;else if(d.id.indexOf('g_')===0)gm[d.id.slice(2)]=o;
        });
        if(!meta)return;
        var id=(meta.order||[])[meta.cur||0],g=gm[id];
        gameEl.innerHTML='';
        if(g){gameEl.appendChild(document.createTextNode('Jeu en cours : '));var b=document.createElement('b');b.textContent=g.name||'—';gameEl.appendChild(b);}
      },function(){});
    }catch(e){}
  }

  var timers=[];
  function later(fn,ms){timers.push(setTimeout(fn,ms));}
  function sweep(){
    bars.forEach(function(b,i){
      b.getAnimations().forEach(function(a){a.cancel();});
      b.animate([{transform:'translateX(-100%) skewX(-12deg)'},{transform:'translateX(33.4%) skewX(-12deg)'}],
        {duration:DUR,delay:i*STAG,easing:'cubic-bezier(.65,0,.35,1)',fill:'both'});
    });
  }
  function pulse(){
    flash.getAnimations().forEach(function(a){a.cancel();});
    flash.animate([{opacity:0},{opacity:.55},{opacity:0}],{duration:260/SPEED,easing:'ease-out'});
  }
  function play(){
    timers.forEach(clearTimeout);timers=[];
    card.classList.remove('show','in');
    void card.offsetWidth;
    /* balayage 1 : on couvre l'écran, puis on montre le logo au milieu */
    sweep();
    later(function(){card.classList.add('show');void card.offsetWidth;card.classList.add('in');pulse();},DUR*.5);
    if(STAY)return;
    /* balayage 2 : on retire le logo au milieu, la scène réapparaît */
    var t2=DUR+STAG*4+HOLD;
    later(sweep,t2);
    later(function(){card.classList.remove('show','in');pulse();},t2+DUR*.5);
  }
  window.addEventListener('keydown',function(e){if(e.key==='r'||e.key==='R'||e.key===' ')play();});
  window.addEventListener('click',play);
  play();
  if(EVERY>0)setInterval(play,EVERY*1000);
})();
</script>
</body>
</html>
